<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tags em html</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    Em HTML5, podemos inserir os elementos da lista a seguir.
    <ul>
        <li title="h1"><ins>Título Principal</ins></li>
        <li title="h2"><ins>Título referente ao principal</ins></li>
        <li title="p"><ins>Parágrafos</ins></li>
        <li title="img"><ins>imagens</ins></li>
        <li title="abbr"><ins>Abreviações</ins></li>
        <li title="code"><ins>Códigos-fontes</ins></li>
        <li title="type"><ins>Listas numeradas</ins></li>
        <li>Listas com demarcadores</li>
    </ul>
</body>
</html>
