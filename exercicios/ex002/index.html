<head>

    <title>Parágrafos</title>
</head>
<body>
    <h1>Parágrafos e quebras de linha</h1>
    <hr>
    <p>Você pode escrever Parágrafos
        de qualquer jeito, basta coloca entre &lt;p&gt; &lt;/p&gt; <!--Less than / greater than--> 
    </p>
    <p>se precisar quebrar o texto em algum lugar especifico como esse, <br>você pode usar a tag br.</p>
    <p>vamos adiciona alguns símbolos Especiais 
        &reg;
        &copy;
        &trade;
        &cent;
        &Delta;
    </p>
    <p>Vamos adiciona alguns emojis
        &#x1f92f;
        
    </p>
