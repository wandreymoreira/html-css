 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible box</title>
    <style>
        div.conteiner {
            background-color: aquamarine;
            display: flex;
            flex-flow: row nowrap;
        }

        div.item {
            background-color: antiquewhite;
            padding: 10px;
            border: 1px solid black;
            text-align: center;
            flex-basis: 200px;
            
        }

        div#caxA {
            flex-shrink: 0;
            flex-grow: 0;
        }
        div#caxB {
            flex-shrink: 1;
            flex-grow: 1;
        }
        div#caxC {
            flex-shrink: 2;
            flex-grow: 1;
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="caxA">A</div>
        <div class="item" id="caxB">B</div>
        <div class="item" id="caxC">C</div>
        
    </div>
</body>
</html>
